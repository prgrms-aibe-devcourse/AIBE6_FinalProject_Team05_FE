language: "ko-KR"

tone_instructions: >
  모든 리뷰 코멘트, 요약, 설명은 영어를 섞지 말고 반드시 한글로만 작성해줘. 단, 코드
  식별자(변수명/함수명/컴포넌트명/파일명)나 기술 용어(API, JWT 등 고유명사)는 원문 그대로
  표기해도 된다. 팀 컨벤션 문서를 기준으로 리뷰해줘. Prettier/ESLint 기준(세미콜론 사용, 싱글 쿼트,
  들여쓰기 4칸)을 따르는지, console.log 등 디버그용 로그가 남아있지 않은지, 사용하지
  않는 변수/import가 제거됐는지 확인해줘. 네이밍은 변수/함수는 camelCase, 컴포넌트/클래스는
  PascalCase, 상수는 UPPER_SNAKE_CASE, 파일명은 kebab-case 또는 역할 기반 네이밍을
  따르는지 확인해줘. 커밋 메시지는 "type: 작업 내용" 형식이며 type은
  feat/fix/docs/style/refactor/test/chore/design/comment/rename/remove/!HOTFIX 중
  하나여야 하고, 실제 작업 내용과 타입이 일치하는지 확인해줘. 주석은 코드만으로 의도가
  명확하지 않은 경우에만 작성되어야 하고, 임시 주석이 남아있거나 TODO에 담당자/목적이
  없으면 지적해줘.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"
  path_filters:
    - "!**/.next/**"
    - "!**/node_modules/**"
    - "!**/*.lock"
    - "!package-lock.json"
    - "!**/*.config.js"
    - "!**/*.config.ts"
  path_instructions:
    - path: "Pokade/app/**/page.tsx"
      instructions: >
        Next.js App Router 페이지 리뷰 기준: 서버 컴포넌트로 둬도 되는 페이지에
        불필요하게 "use client"가 붙어있지 않은지, 데이터 페칭이 서버 컴포넌트에서
        이루어지는지, 로딩/에러 상태(loading.tsx, error.tsx) 처리가 빠지지 않았는지
        확인해줘.
    - path: "Pokade/components/**/*.tsx"
      instructions: >
        공용 컴포넌트 리뷰 기준: props 타입이 명확히 정의되어 있는지, 재사용 가능한
        로직이 컴포넌트 내부에 중복되어 있지 않은지, 접근성(a11y - alt, aria-label 등)이
        누락되지 않았는지 확인해줘.
    - path: "Pokade/lib/**/*.ts"
      instructions: >
        API 클라이언트/유틸 리뷰 기준: fetch 에러 핸들링이 일관되게 처리되는지,
        중복된 API 호출 로직이 여러 곳에 흩어져 있지 않은지, 타입이 응답 스키마와
        일치하는지 확인해줘.
    - path: "Pokade/store/**/*.ts"
      instructions: >
        Zustand 스토어 리뷰 기준: 상태와 액션의 책임이 분리되어 있는지, 불필요하게
        전역 상태로 관리되는 지역 상태는 없는지, selector 사용으로 리렌더링 최적화가
        고려됐는지 확인해줘.
    - path: "**/*.tsx"
      instructions: >
        TypeScript/React 공통 리뷰 기준: any 타입 남용, 불필요한 useEffect 의존성,
        key 없이 렌더링되는 리스트가 없는지 확인해줘.

chat:
  auto_reply: true
